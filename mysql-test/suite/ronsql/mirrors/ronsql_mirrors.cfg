# ronsql_mirrors.cfg -- the RonSQL mirror suites, read by ronsql_mirrors.pl.
#
# The t/*.test and r/*.result files of the suites below are GENERATED from
# their base suite.  After changing this file, or adding, changing or
# removing a base test, run from mysql-test/
#
#   perl suite/ronsql/mirrors/ronsql_mirrors.pl --write
#
# and commit the mirror files it writes together with the change.  The
# test ronsql.ronsql_mirror_check (the same script with --check) fails
# while a mirror file is missing or differs, or while a mirror suite holds
# a file this config does not account for.  --write is idempotent.
#
# A new base test is mirrored in every full mirror suite of its base suite
# the next time --write runs: ronsql -> ronsql_jit; ronsql_cte ->
# ronsql_cte_jit and ronsql_cte_ng1r3 / ng2r2 / ng2r3 / ng4r2; ronsql_fs ->
# ronsql_fs_jit, ronsql_fs_ng2r2 and ronsql_fs_ng4r2.  A JIT mirror is
# strict-armed with a recorded fallback delta of 0; run it once, and if
# the delta differs, record it here (mirror TEST delta=N) and run --write.
# If a test must not be mirrored in a suite, add an exclude line with the
# reason to that suite's section: tests that arm their own error inserts
# (`all error N`, and `all error 0` clears the JIT arm's 4064 / 5120) have
# no JIT mirror; tests that run no program on the data nodes (parser, CLI,
# EXPLAIN only, prepare-time refusals) have no JIT or topology mirror; a
# test with its own .cnf has no mirror.  A subset suite (ronsql_ng2r2, the
# ronsql suite on 2 node groups) mirrors only the tests that have a mirror
# line in its section.
#
# Syntax.  A line starting with # is a comment.
#   [SUITE ...]          a section; its lines apply to each suite named.  A
#                        suite may appear in several sections.
#   base SUITE           the base suite (required)
#   kind jit|copy|pin    how a mirror is made (required):
#     jit   the wrapper sources the base test between jit_strict_arm.inc
#           and jit_strict_disarm.inc of `arm` (not when unarmed), inside
#           the ndbinfo.jit fallback-delta pin; the result is the pin's SET
#           line, the base result and the pin's SELECT with the delta.
#     copy  the wrapper and the result are copies of the base files.
#     pin   the wrapper selects the number of data nodes, then sources the
#           base test; the result is those three lines and the base result.
#   arm DIR              (jit) the directory of the arm / disarm includes
#   data_nodes N         (pin) the data node count the result records
#   subset               mirror only the tests that have a mirror line
#   template NAME        a wrapper header comment, given by the "|" lines
#                        that follow ("| text", or "|" for an empty line);
#                        @NAME@ is the test, @BASE@ the base suite.  A jit
#                        or pin suite needs a template named default.
#   exclude TEST REASON  TEST of the base suite has no mirror in the suite
#   own TEST REASON      TEST is a test of the mirror suite itself
#   mirror TEST [OPT...] options of TEST's mirror (in a subset suite this
#                        line also selects TEST):
#     unarmed            (jit) not strict-armed: the delta pin only
#     var=NAME           (jit) the pin's user variable (default jit_c0)
#     delta=N            (jit) the recorded fallback delta (default 0)
#     header=NAME        the template to use instead of default
#                        "|" lines right after a mirror line are a header
#                        of TEST's own.
#   subst TEST           changes TEST's generated result: each "- OLD" line
#                        and the "+ NEW" line after it replace every line
#                        OLD of the result with NEW (OLD must occur).

# ===========================================================================
# JIT arms: CompiledInterpreter=ON (the base suites pin it OFF).

[ronsql_jit ronsql_cte_jit]
kind jit
template default
| # Mirror of suite/@BASE@/t/@NAME@.test with the JIT active
| # (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # The recorded fallback delta below is the coverage pin for this
| # test: every JIT program reject it causes (aggregation, scan
| # filter — one count per compile attempt) is counted. A change in
| # EITHER direction is a coverage change: investigate, then re-record
| # deliberately.
template wrapped
| # Mirror of suite/@BASE@/t/@NAME@.test with the JIT
| # active (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # The recorded fallback delta below is the coverage pin for this
| # test: every JIT program reject it causes (aggregation, scan
| # filter — one count per compile attempt) is counted. A change in
| # EITHER direction is a coverage change: investigate, then re-record
| # deliberately.

# ---------------------------------------------------------------------------
[ronsql_jit]
base ronsql
arm suite/ronsql_jit/include

exclude ronsql_agg_drain  arms its own DBTUP error inserts 4042 / 4043, which replace the arm's 4064, and clears 5120 with all error 0 (an unarmed census mirror would work: mirror ronsql_agg_drain unarmed)
exclude ronsql_cli_silent  ronsql_cli option parsing (--silent, -s); its one SUM is a shape every JIT mirror runs
exclude ronsql_cluster_unavailable  single user mode refuses every RonSQL scan before a program runs; it tests the retry classification
exclude ronsql_explain_conditions  EXPLAIN only: prints the WHERE of the parse tree, runs no program
exclude ronsql_groupby_blob  every case is refused at prepare time (NdbAggregator::GroupBy in the API); no program reaches a data node
exclude ronsql_having_refs  parser checks through $PARSE_TEST; no cluster query
exclude ronsql_mirror_check  checks the mirror files; runs no query
exclude ronsql_operation_id  RDRS's JSON echo of operationId; its only query is the COUNT(*) shortcut (fragment statistics, no program)
exclude ronsql_parser_oom  OOM injection in the parser; no program
exclude ronsql_retry_after_output  needs its own .cnf (RDRS MaxRespSize) and arms DBLQH error insert 5023, which replaces the arm's 5120
exclude ronsql_single_table_faults  arms DBLQH error inserts 5055 / 5047 / 5030 on one node, which replace the arm's 5120, and clears the arm with all error 0
exclude ronsql_size_limits  needs its own .cnf (RDRS request and response caps); HTTP limits only
exclude ronsql_stale_index_schema  RDRS's schema cache against concurrent DDL, with pinned attempt counts; its one GROUP BY / SUM shape runs in other JIT mirrors
exclude ronsql_stale_join_root_index  RDRS's schema cache against concurrent DDL on a join root's index, with pinned attempt counts; its one join aggregate shape runs in other JIT mirrors
exclude ronsql_subquery_retry  arms DBLQH error insert 5023, which replaces the arm's 5120, and clears the arm with all error 0

mirror ronsql_avg_formatting var=avg_format_jit_c0
| # Share AVG display cases with the interpreter suite; require compiled programs.
mirror ronsql_basic unarmed delta=32
mirror ronsql_binary_passthrough unarmed
| # Mirror of suite/ronsql/t/ronsql_binary_passthrough.test with the JIT
| # active (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # PIN-ONLY. Pass-through projections carry no aggregation program; the
| # snowflake cases compile the CTE body's COUNT(*) program. The recorded
| # fallback delta below is the coverage pin: a change in EITHER direction
| # is a coverage change — investigate, then re-record deliberately.
mirror ronsql_case_arm_types unarmed delta=28
| # Mirror of suite/ronsql/t/ronsql_case_arm_types.test with the JIT active
| # (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # Not strict-armed: a CASE slot updated from a DOUBLE arm and from an
| # integer arm, or a GREATEST / LEAST register that is DOUBLE on one path
| # and BIGINT on the other, has no single type, so the bridge rejects
| # those programs and the interpreter runs them.  The recorded fallback
| # delta below is the coverage pin for this test.  A change in EITHER
| # direction is a coverage change: investigate, then re-record
| # deliberately.
mirror ronsql_cte_collect_collapse unarmed
| # Mirror of suite/ronsql/t/ronsql_cte_collect_collapse.test with the JIT
| # active (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # PIN-ONLY. The collapsed collect form is a pass-through ORDER BY scan with
| # no aggregation program; the scan filter of cc-7 (an extra equality on a
| # VARCHAR column) is the only program the JIT may see. The recorded
| # fallback delta below is the coverage pin: a change in EITHER direction is
| # a coverage change — investigate, then re-record deliberately.
mirror ronsql_cte_minmax_string_redist
| # Mirror of suite/ronsql/t/ronsql_cte_minmax_string_redist.test with the
| # JIT active (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056
| # RonSQL differential. Test logic lives ONLY in the sourced original.
| #
| # The compiled string MIN/MAX over a CTE result goes through the same
| # side-table kernel (jitMinMaxStringLinked -> minMaxString), so the
| # compares on the node that holds c2 groups only from redistribution are
| # checked here on the JIT path.
| #
| # The recorded fallback delta below is the coverage pin for this
| # test: every JIT program reject it causes (aggregation, scan
| # filter — one count per compile attempt) is counted. A change in
| # EITHER direction is a coverage change: investigate, then re-record
| # deliberately.
mirror ronsql_cte_single_group_flatten header=wrapped
mirror ronsql_float_formatting var=float_format_jit_c0
| # Share FLOAT display cases with the interpreter suite; require compiled programs.
mirror ronsql_in_list_agg_lookups var=in_list_agg_lookups_jit_c0
| # WP-F F1b: aggregating primary-key reads.  RonSQL marks its aggregation
| # programs reusable, so each read's one-row interpreter takes the
| # compiled program from the node's JIT cache.  The strict arming covers
| # the scan compile path only (4064); the fallback census pins that no
| # program falls back.
mirror ronsql_in_list_lookups unarmed var=in_list_lookups_jit_c0
| # WP-F F1a: primary-key lookups for IN lists carry no aggregation
| # program; only the residual filter rides a lookup, as interpreted code
| # outside the compiled-program path.  Census pin only: the fallback
| # delta must stay 0 (arm strict once the recorded delta is 0 and the
| # lookup filters are known to compile).
mirror ronsql_in_list_ranges var=in_list_ranges_jit_c0 delta=96
| # WP-F F2: IN lists as multi-range index scans, the aggregate ones with
| # pushdown aggregation across ranges.  The strict arming makes an
| # aggregation program that fails to compile stop the test; residual scan
| # filters are outside it.  The census pins the recorded fallback delta
| # (96 at the first recording, 2026-09-23, not yet attributed).
mirror ronsql_in_list_spj var=in_list_spj_jit_c0 delta=8
| # WP-F F3: IN lists on pushed-query roots (CTE body roots, join roots) as
| # multi-range bounds in the query definition, and the F14 VARCHAR bound
| # fix.  The strict arming makes an aggregation program that fails to
| # compile stop the test; the census records the fallback delta of the
| # whole test (residual filters included; 8 at the first recording,
| # 2026-09-24, not yet attributed).
mirror ronsql_minmax_string_leaves
| # Mirror of suite/ronsql/t/ronsql_minmax_string_leaves.test with the JIT
| # active (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # The compiled string MIN/MAX goes through the same side-table lookup
| # (jitMinMaxStringCol -> minMaxString), so the later-leaf compares are
| # checked here on the JIT path.
| #
| # The recorded fallback delta below is the coverage pin for this
| # test: every JIT program reject it causes (aggregation, scan
| # filter — one count per compile attempt) is counted. A change in
| # EITHER direction is a coverage change: investigate, then re-record
| # deliberately.
mirror ronsql_string_agg_interleaved unarmed
| # Mirror of suite/ronsql/t/ronsql_string_agg_interleaved.test with the JIT
| # active (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential. Test logic lives ONLY in the sourced original.
| #
| # PIN-ONLY (no jit_strict_arm.inc). The "string agg, numeric agg, string
| # MIN/MAX on the same register" shape used to be a bridge reject (the
| # fused string-load lowering took only CONSECUTIVE consumers; recorded
| # pin 100). ronsql_jit item 16 (2026-09-09) lowers non-adjacent string
| # consumers where they occur, so the pin is 0 now. Before item 16 the
| # MAX/SUM/COUNT(s_val) query also returned a WRONG count under ON (a bare
| # COUNT on the string register counted NULL rows: 4 instead of 2), and
| # the first recording of this mirror baked that into its "== Diff =="
| # block — a non-empty diff block in a recorded result is a JIT wrong
| # result, never an expectation. The crash this test
| # guards against was in the interpreter (both arms exercise it: the
| # interpreter directly under OFF, and any per-row fallback under ON).
| # Re-record the pin deliberately when it moves.
mirror ronsql_subquery_typed_results header=wrapped
mirror ronsql_sum64 var=sum64_jit_c0
| # Run the same checked 64-bit SUM cases with strict JIT compilation.

# ---------------------------------------------------------------------------
[ronsql_cte_jit]
base ronsql_cte
arm suite/ronsql_cte_jit/include

own ronsql_cte_jit_census  two CTE queries under the must-JIT error insert 4060 with compile-activity asserts; not a mirror

exclude cte_agg_feed_eviction  arms DBLQH error insert 5126, which replaces the arm's 5120, and clears the arm with ALL ERROR 0
exclude cte_park_basic  arms DBLQH error insert 5151, which replaces the arm's 5120, and clears the arm with ALL ERROR 0
exclude cte_park_sweeper  arms DBLQH error insert 5139, which replaces the arm's 5120, and clears the arm with ALL ERROR 0
exclude cte_redist_pages  arms DBLQH error insert 5134, which replaces the arm's 5120, and clears the arm with ALL ERROR 0
exclude cte_scan_batches  arms DBLQH error insert 5129, which replaces the arm's 5120, and clears the arm with ALL ERROR 0
exclude spj_ronsql_e17_cte_scan_start  arms DBTC error insert 8128 and clears the arm with ALL ERROR 0
exclude spj_ronsql_q6_decimal_sum  disabled (suite/ronsql/disabled.def: exact DECIMAL aggregation, Q-6 / E-16); mirror it when it is enabled
exclude spj_state_s15_eviction_cte  arms DBTUP error insert 4041, which replaces the arm's 4064, and clears the arm with ALL ERROR 0
exclude spj_state_s15_eviction_join  arms DBTUP error insert 4041, which replaces the arm's 4064, and clears the arm with ALL ERROR 0
exclude spj_state_s5_cte_lookup_successor  arms DBLQH error insert 5131, which replaces the arm's 5120, and clears the arm with ALL ERROR 0

mirror ronsql_cte_dd_avg unarmed
mirror ronsql_cte_dd_bigquery unarmed delta=2
mirror ronsql_cte_dd_child_bounds unarmed
mirror ronsql_cte_dd_lastn_agg unarmed
mirror ronsql_cte_dd_nullable_bounds unarmed
mirror ronsql_cte_dd_passthrough_limit unarmed
mirror ronsql_cte_dd_passthrough_orderby unarmed
mirror ronsql_cte_dd_passthrough_orderby_index unarmed

# ---------------------------------------------------------------------------
[ronsql_fs_jit]
base ronsql_fs
kind jit
arm suite/ronsql_cte_jit/include
template default
| # Mirror of suite/@BASE@/t/@NAME@.test with the JIT active
| # (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential for the feature-store corpus (RONDB-1121 E8).  Test logic
| # lives ONLY in the sourced original.
| #
| # STRICT ARM (2026-09-12): the recorded fallback delta of this test is 0 —
| # every program of the Hopsworks corpus compiles — so the --source is
| # bracketed with the strict-compile error inserts (ERROR_INSERT 4064 in
| # DBTUP, 5120 in the DBLQH proxy; suite/ronsql_cte_jit/include): a program
| # that stops compiling now FAILS the query instead of falling back to the
| # interpreter.  The delta line stays as the census pin (expected 0); a
| # change in either direction is a coverage change — investigate, then
| # re-record deliberately.
template census
| # Mirror of suite/@BASE@/t/@NAME@.test with the JIT active
| # (CompiledInterpreter=ON) — the JIT arm of the RONDB-1056 RonSQL
| # differential for the feature-store corpus (RONDB-1121 E8).  Test logic
| # lives ONLY in the sourced original.
| #
| # The recorded fallback delta below is the coverage pin for this test:
| # every JIT program reject it causes (aggregation, scan filter — one count
| # per compile attempt) is counted.  A change in EITHER direction is a
| # coverage change: investigate, then re-record deliberately.  Once the
| # delta is 0, bracket the --source with
| #   --source suite/ronsql_cte_jit/include/jit_strict_arm.inc
| #   --source suite/ronsql_cte_jit/include/jit_strict_disarm.inc
| # so a program that stops compiling fails the test instead of falling back.

mirror ronsql_fs_fuzz_env unarmed header=census
mirror ronsql_fs_fuzz_spec unarmed delta=136 header=census

# ===========================================================================
# Topology arms.  The base suites run on 2 data nodes (1 node group x 2
# replicas).

[ronsql_cte_ng1r3 ronsql_cte_ng2r2 ronsql_cte_ng2r3 ronsql_cte_ng4r2]
base ronsql_cte
kind copy

exclude ronsql_cte_dd_orderby_limit_reject  prepare-time refusals only; no query reaches the data nodes
exclude spj_ronsql_q6_decimal_sum  disabled (suite/ronsql/disabled.def: exact DECIMAL aggregation, Q-6 / E-16); mirror it when it is enabled

[ronsql_cte_ng2r2]
own cte_nodefail_coordinator  a real node failure (cte_nodefail.inc) that needs 2 node groups
own cte_nodefail_peer  a real node failure (cte_nodefail.inc) that needs 2 node groups

[ronsql_cte_ng2r3 ronsql_cte_ng4r2]
exclude cte_redist_pages  needs a redistribution page chain of more than 256 pages on one owner node (cte_redist_wait.inc); the lineitem groups spread over 6 or 8 data nodes may not give one
exclude cte_scan_batches  csb-2 needs a CTE scan continuation, i.e. more than one 256-row batch of the 1500 groups on one node; 6 or 8 data nodes hold about 250 or 190 each

# ---------------------------------------------------------------------------
[ronsql_fs_ng2r2 ronsql_fs_ng4r2]
base ronsql_fs
kind pin

[ronsql_fs_ng2r2]
data_nodes 4
template default
| # Mirror of suite/@BASE@/t/@NAME@.test on the 2 node groups x 2 replicas (4 data nodes) topology
| # (RONDB-1121 E8).  Test logic lives ONLY in the sourced original; the first
| # statement pins the topology so the mirror cannot run on the base cluster.

[ronsql_fs_ng4r2]
data_nodes 8
template default
| # Mirror of suite/@BASE@/t/@NAME@.test on the 4 node groups x 2 replicas (8 data nodes) topology
| # (RONDB-1121 E8).  Test logic lives ONLY in the sourced original; the first
| # statement pins the topology so the mirror cannot run on the base cluster.

# ---------------------------------------------------------------------------
# The ronsql suite on 2 node groups (RONDB-1124 T-3): the tests whose paths
# depend on the fragment count or the topology.  A subset: add a mirror line
# to mirror another ronsql test here.  Left out on purpose:
#   ronsql_subquery_retry  error insert 5023 drops a SCAN_NEXTREQ only from
#     the data node's own DBTC; on 4 data nodes the one-fragment READ_BACKUP
#     table has no replica on the TC node of some attempts, so the first
#     attempt may succeed and sr-2's "more than one attempt" fails.
#   tests with their own .cnf (ronsql_size_limits, ronsql_retry_after_output).
[ronsql_ng2r2]
base ronsql
kind pin
data_nodes 4
subset
template default
| # Mirror of suite/@BASE@/t/@NAME@.test on the 2 node groups x 2 replicas (4 data nodes) topology
| # (RONDB-1124 T-3).  Test logic lives ONLY in the sourced original; the first
| # statement pins the topology so the mirror cannot run on the base cluster.

# IN lists: aggregating primary-key reads merged like fragment partials,
# multi-range scans (SF_MultiRange), IN lists on pushed-query roots.
mirror ronsql_in_list_agg_lookups
mirror ronsql_in_list_lookups
mirror ronsql_in_list_ranges
mirror ronsql_in_list_spj
# Single-table key reads start their transaction on a replica of the first
# key (X-16): every read is TC-local only when the hint works.
mirror ronsql_pk_lookup_tc_hint
# Subqueries: inner statements whose results are substituted.
mirror ronsql_subquery
mirror ronsql_subquery_agg
mirror ronsql_subquery_agg_ext
mirror ronsql_subquery_as_condition
mirror ronsql_subquery_filter_decimal
mirror ronsql_subquery_null_where
mirror ronsql_subquery_typed_results
mirror ronsql_subquery_unary_minus
# Join aggregation, NULL rows of outer joins, empty tables.
mirror ronsql_join_agg
mirror ronsql_chained_left_join
mirror ronsql_emptytable_and_nulls
mirror ronsql_cross_filter_scalar_agg
# ORDER BY of grouped results; the pass-through ORDER BY scan (SF_OrderBy
# merge over the fragments).
mirror ronsql_orderby
mirror ronsql_orderby_stress
mirror ronsql_cte_collect_collapse
# Per-fragment partials: drains, record sizes, the COUNT(*) fragment
# statistics, checked 64-bit SUM merge, string MIN / MAX merge.
mirror ronsql_agg_drain
mirror ronsql_agg_record_size
mirror ronsql_count_star_ring_buffer
mirror ronsql_sum64
mirror ronsql_minmax_string
mirror ronsql_minmax_string_leaves
mirror ronsql_cte_minmax_string_redist
# DOUBLE and DECIMAL SUM / AVG merged from more partials (the data of these
# tests are exact in binary or have two operands, so the merge order cannot
# change a printed digit).
mirror ronsql_avg_formatting
mirror ronsql_float_formatting
mirror ronsql_decimal_round_half_up
