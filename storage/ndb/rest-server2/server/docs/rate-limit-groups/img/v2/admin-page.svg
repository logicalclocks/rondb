<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <style>
      .h { fill:#202a33; font-weight:700; }
      .t { fill:#202a33; }
      .m { fill:#566574; font-size:13px; }
      .c { fill:#566574; font-size:13px; font-family: Menlo, Consolas, monospace; }
      .mono { font-family: Menlo, Consolas, monospace; font-size:14px; fill:#202a33; }
      .white { fill:#fff; }
      .teal { fill:#096b67; }
      .chip { fill:#edf4f4; stroke:#8aa5a3; }
      .box { fill:#fff; stroke:#b9c7cc; }
      .input { fill:#fff; stroke:#8aa5a3; }
      .panel { fill:#fff; stroke:#d7e0e5; }
      .ok { fill:#1d7a3a; font-size:13px; }
      .pend { fill:#b67a12; font-size:13px; }
      .red { fill:#b3261e; }
      .note { fill:#fbf3e4; }
      .call { stroke:#566574; stroke-dasharray:4 4; fill:none; }
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#f7f8fa"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1800" height="54" fill="#096b67"/>
  <text x="28" y="34" class="white" font-size="17" font-weight="700">Hopsworks</text>
  <text x="140" y="34" class="white" font-size="15" opacity="0.85">Admin  ›  Rate limit groups</text>

  <!-- LEFT: group list, grouped by cluster -->
  <rect x="28" y="84" width="770" height="640" rx="8" class="panel"/>
  <text x="52" y="122" class="h" font-size="19">Rate limit groups</text>
  <rect x="650" y="100" width="124" height="34" rx="6" class="teal"/>
  <text x="712" y="123" class="white" text-anchor="middle" font-weight="700">+ New group</text>

  <!-- cluster section: main -->
  <rect x="52" y="146" width="722" height="28" fill="#edf4f4"/>
  <text x="64" y="165" class="h" font-size="14">▼ main</text>
  <text x="774" y="165" class="m" text-anchor="end">cap 50% · groups 27% · other 0% · free 23%</text>
  <text x="64" y="196" class="mono">recommender_team_rl</text>
  <text x="276" y="196" class="t">20%</text>
  <text x="336" y="196" class="t" font-size="13">Project Recommender</text>
  <text x="540" y="196" class="t" font-size="13" font-style="italic">every cluster</text>
  <text x="690" y="196" class="ok">● installed</text>
  <text x="64" y="226" class="mono">mary_mike_rl</text>
  <text x="276" y="226" class="t">2%</text>
  <text x="336" y="226" class="t" font-size="13">Mary, Mike</text>
  <text x="540" y="226" class="t" font-size="13" font-style="italic">every cluster</text>
  <text x="690" y="226" class="ok">● installed</text>
  <rect x="52" y="238" width="722" height="36" fill="#edf4f4"/>
  <rect x="52" y="238" width="4" height="36" fill="#096b67"/>
  <text x="64" y="261" class="mono" font-weight="700">recommender2_rl</text>
  <text x="276" y="261" class="t">5%</text>
  <text x="336" y="261" class="t" font-size="13">Project Recommender2</text>
  <text x="540" y="261" class="t" font-size="13" font-style="italic">every cluster</text>
  <text x="690" y="261" class="ok">● installed</text>

  <!-- cluster section: rondb-m -->
  <rect x="52" y="288" width="722" height="28" fill="#edf4f4"/>
  <text x="64" y="307" class="h" font-size="14">▼ rondb-m</text>
  <text x="774" y="307" class="m" text-anchor="end">cap 50% · groups 17% · other 10% · free 23%</text>
  <text x="64" y="338" class="mono">recommender_m_rl</text>
  <text x="276" y="338" class="t">10%</text>
  <text x="336" y="338" class="t" font-size="13">Project Recommender</text>
  <text x="540" y="338" class="t" font-size="13" font-style="italic">this cluster</text>
  <text x="690" y="338" class="pend">● partial</text>
  <text x="64" y="368" class="mono">mary_mike_rl</text>
  <text x="276" y="368" class="t">2%</text>
  <text x="336" y="368" class="t" font-size="13">Mary, Mike</text>
  <text x="540" y="368" class="t" font-size="13" font-style="italic">every cluster</text>
  <text x="690" y="368" class="ok">● installed</text>
  <text x="64" y="398" class="mono">recommender2_rl</text>
  <text x="276" y="398" class="t">5%</text>
  <text x="336" y="398" class="t" font-size="13">Project Recommender2</text>
  <text x="540" y="398" class="t" font-size="13" font-style="italic">every cluster</text>
  <text x="690" y="398" class="ok">● installed</text>
  <text x="64" y="424" class="m">recommender_team_rl is fully overridden here by recommender_m_rl: its USER is not installed and holds no budget (7.4).</text>

  <!-- collapsed cluster sections -->
  <rect x="52" y="438" width="722" height="26" fill="#f1f3f5"/>
  <text x="64" y="456" class="h" font-size="14">▶ rondb-s</text>
  <text x="774" y="456" class="m" text-anchor="end">cap 50% · groups 27% · other 0% · free 23%</text>
  <rect x="52" y="470" width="722" height="26" fill="#f1f3f5"/>
  <text x="64" y="488" class="h" font-size="14">▶ rondb-r</text>
  <text x="774" y="488" class="m" text-anchor="end">unreachable: capacity unknown; its groups show pending</text>

  <text x="52" y="520" class="pend">Saving the edit on the right raises main to 30% and rondb-m to 20%; a section that would exceed its cap turns red.</text>

  <text x="52" y="548" class="m">Cap is the cluster's configured limit (section 14). Groups sums the budgets desired on that cluster, so a fully overridden</text>
  <text x="52" y="566" class="m">group does not count. Other is budget held outside groups: operator USER entries and database quotas carrying a</text>
  <text x="52" y="584" class="m">rate-per-sec. Free = cap − groups − other. All read live per data node (USER CAPACITY, section 13.3).</text>

  <!-- legend -->
  <text x="52" y="614" class="h">State (per group, per cluster)</text>
  <text x="52" y="636" class="ok">● installed</text><text x="150" y="636" class="m">Hopsworks has run USER SET for this name on this cluster; the limit is live.</text>
  <text x="52" y="658" class="pend">● pending</text><text x="150" y="658" class="m">Saved; not installed yet (or the cluster is unreachable). Traffic runs unlimited until it is.</text>
  <text x="52" y="680" fill="#b3261e" font-size="13">● refused</text><text x="150" y="680" class="m">RonDB rejected USER SET (the cap is full); the row shows the stored error. Lower another budget.</text>
  <text x="52" y="702" fill="#b67a12" font-size="13">● partial</text><text x="150" y="702" class="m">Stopped mid-group: the rate and some aliases are live; the row shows the coverage and the error.</text>

  <!-- LEFT, below: the delete confirmation -->
  <text x="52" y="754" class="m">Confirmation dialog, opened by Delete group on the form. A deleted group leaves every section at once.</text>
  <rect x="32" y="773" width="770" height="376" rx="8" fill="#000" opacity="0.06"/>
  <rect x="28" y="768" width="770" height="376" rx="8" fill="#fff" stroke="#e3b7b3"/>
  <text x="52" y="808" class="h" font-size="19">Delete recommender2_rl?</text>
  <text x="52" y="840" class="t">Hopsworks deletes the group, then removes it from every cluster it is installed on</text>
  <text x="52" y="860" class="t">(main, rondb-m, rondb-s, rondb-r), aliases first:</text>
  <rect x="52" y="874" width="722" height="60" rx="6" fill="#f1f3f5" stroke="#d7e0e5"/>
  <text x="66" y="898" class="mono">USER ALIAS DROP Recommender2_rosa9e1f</text><text x="430" y="898" class="m">Rosa's account in Recommender2</text>
  <text x="66" y="922" class="mono">USER DROP recommender2_rl</text><text x="430" y="922" class="m">the 5% budget</text>
  <rect x="52" y="948" width="722" height="56" rx="6" class="note"/>
  <rect x="52" y="948" width="4" height="56" fill="#b67a12"/>
  <text x="68" y="971" class="t">Rosa is in no other group, so her work runs unmetered afterwards.</text>
  <text x="68" y="993" class="t">5% of each section's cap is freed: main 27% → 22%, rondb-m 17% → 12%.</text>
  <text x="52" y="1036" class="m">Writes</text>
  <text x="52" y="1056" class="c">DELETE FROM rate_limit_group WHERE name = 'recommender2_rl'</text>
  <text x="52" y="1074" class="c">Who and state rows go with it (ON DELETE CASCADE).</text>
  <rect x="546" y="1096" width="90" height="38" rx="6" fill="#fff" stroke="#8aa5a3"/>
  <text x="591" y="1121" class="t" text-anchor="middle">Cancel</text>
  <rect x="650" y="1096" width="124" height="38" rx="6" class="red"/>
  <text x="712" y="1121" class="white" text-anchor="middle" font-weight="700">Delete group</text>

  <!-- RIGHT: edit form, with an unsaved budget change -->
  <rect x="826" y="84" width="600" height="980" rx="8" class="panel"/>
  <text x="850" y="122" class="h" font-size="19">Edit rate limit group</text>
  <text x="1402" y="122" class="pend" text-anchor="end">● unsaved changes</text>

  <!-- Name -->
  <text x="850" y="170" class="h">Name</text>
  <text x="850" y="190" class="m">The RonDB identity. Cannot be changed after saving.</text>
  <rect x="850" y="200" width="552" height="40" rx="6" fill="#f1f3f5" stroke="#d7e0e5"/>
  <text x="864" y="226" class="mono" fill="#566574">recommender2_rl</text>

  <!-- Budget -->
  <text x="850" y="282" class="h">Budget</text>
  <text x="850" y="302" class="m">Percent of each targeted cluster's database-work capacity. 0.01 to the cluster's cap (default 50).</text>
  <rect x="850" y="312" width="110" height="40" rx="6" fill="#fff" stroke="#b67a12" stroke-width="2"/>
  <text x="864" y="338" class="t">8</text>
  <text x="970" y="338" class="t">%</text>
  <text x="1000" y="338" class="m">≈ 1,600,000 rate-per-sec on 20-thread data nodes</text>
  <text x="1312" y="338" class="pend">was 5%</text>

  <!-- Who -->
  <text x="850" y="394" class="h">Who shares this budget</text>
  <text x="850" y="414" class="m">Login users and/or whole projects. A project means its current members.</text>
  <rect x="850" y="424" width="552" height="52" rx="6" class="input"/>
  <rect x="860" y="434" width="236" height="32" rx="16" class="chip"/>
  <text x="876" y="455" class="t">Project · Recommender2</text>
  <text x="1082" y="456" class="m">×</text>
  <text x="1110" y="455" class="m">+ add user or project</text>

  <!-- Cluster -->
  <text x="850" y="520" class="h">Where it applies</text>
  <circle cx="860" cy="548" r="8" fill="#fff" stroke="#096b67" stroke-width="2"/>
  <circle cx="860" cy="548" r="4" fill="#096b67"/>
  <text x="878" y="553" class="t">Every cluster</text>
  <text x="878" y="572" class="m">This percentage on each RonDB cluster.</text>
  <circle cx="860" cy="604" r="8" fill="#fff" stroke="#8aa5a3"/>
  <text x="878" y="609" class="t">One cluster</text>
  <rect x="878" y="622" width="524" height="40" rx="6" fill="#f1f3f5" stroke="#d7e0e5"/>
  <text x="894" y="648" class="m">select a cluster…   (main · rondb-m · rondb-s · rondb-r)</text>
  <text x="878" y="682" class="m">Clusters are discovered live; a group naming one overrides an every-cluster group there.</text>

  <!-- preview -->
  <rect x="850" y="706" width="552" height="74" rx="6" fill="#edf4f4"/>
  <rect x="850" y="706" width="4" height="74" fill="#096b67"/>
  <text x="866" y="732" class="h">Read it as a sentence</text>
  <text x="866" y="756" class="t">Members of Recommender2 (today: Rosa) share an 8% budget</text>
  <text x="866" y="774" class="t">on every cluster, for everything they do.</text>

  <!-- what saving runs -->
  <rect x="850" y="798" width="552" height="96" rx="6" class="note"/>
  <rect x="850" y="798" width="4" height="96" fill="#b67a12"/>
  <text x="866" y="822" class="h">Saving runs on every cluster</text>
  <text x="866" y="846" class="mono">USER ALTER recommender2_rl</text>
  <text x="1096" y="846" class="m">5% → 8%, converted per cluster</text>
  <text x="866" y="870" class="m">No alias is added or dropped: Who and Where it applies are unchanged.</text>

  <!-- status -->
  <text x="850" y="928" class="h">Status</text>
  <text x="850" y="952" class="ok">● installed</text>
  <text x="940" y="952" class="m">5% is live on every cluster; saving re-runs the install.</text>
  <text x="850" y="976" class="m">Does not grant access. Rosa must already be allowed to read what she reads.</text>

  <!-- buttons -->
  <rect x="850" y="1006" width="130" height="38" rx="6" fill="#fff" stroke="#b3261e"/>
  <text x="915" y="1031" fill="#b3261e" text-anchor="middle" font-weight="700">Delete group</text>
  <rect x="1206" y="1006" width="90" height="38" rx="6" fill="#fff" stroke="#8aa5a3"/>
  <text x="1251" y="1031" class="t" text-anchor="middle">Cancel</text>
  <rect x="1312" y="1006" width="90" height="38" rx="6" class="teal"/>
  <text x="1357" y="1031" class="white" text-anchor="middle" font-weight="700">Save</text>

  <!-- CALLOUTS: what each field writes -->
  <text x="1454" y="122" class="h" font-size="15">Writes to</text>
  <line x1="1402" y1="220" x2="1454" y2="220" class="call"/>
  <text x="1462" y="216" class="c">rate_limit_group</text>
  <text x="1462" y="234" class="c">  .name = 'recommender2_rl'</text>

  <line x1="1402" y1="332" x2="1454" y2="332" class="call"/>
  <text x="1462" y="328" class="c">rate_limit_group</text>
  <text x="1462" y="346" class="c">  .budget_percent = 8.00</text>

  <line x1="1402" y1="450" x2="1454" y2="450" class="call"/>
  <text x="1462" y="446" class="c">rate_limit_group_user</text>
  <text x="1462" y="464" class="c">  (uid NULL, project_id 14)</text>

  <line x1="1402" y1="548" x2="1454" y2="548" class="call"/>
  <text x="1462" y="544" class="c">rate_limit_group</text>
  <text x="1462" y="562" class="c">  .cluster = NULL   (every cluster)</text>
  <text x="1462" y="580" class="c">  or .cluster = 'rondb-m'</text>

  <line x1="1402" y1="846" x2="1454" y2="846" class="call"/>
  <text x="1462" y="842" class="c">preview only, nothing written;</text>
  <text x="1462" y="860" class="c">Save writes the rows above and</text>
  <text x="1462" y="878" class="c">runs the immediate pass (section 10)</text>

  <line x1="1402" y1="952" x2="1454" y2="952" class="call"/>
  <text x="1462" y="948" class="c">read back from</text>
  <text x="1462" y="966" class="c">  rate_limit_group_cluster_state</text>
  <text x="1462" y="984" class="c">  (written by the installer)</text>
</svg>
